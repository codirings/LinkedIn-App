buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"

    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        def cmake = subproject.extensions.getByName("android").defaultConfig.externalNativeBuild.cmake
        if (!cmake.arguments.any { it.startsWith("-DANDROID_CXX_STANDARD_LIBRARIES=") }) {
            // NDK 27 omits the shared C++ runtime from native library link commands.
            cmake.arguments.add("-DANDROID_CXX_STANDARD_LIBRARIES=-lc++_shared")
        }
    }
}
